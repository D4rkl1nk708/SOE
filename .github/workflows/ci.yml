name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    environment: Production

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Create environment files
      run: |
        echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> $GITHUB_ENV
        echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
        # Fallback .env
        echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
        echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
        # Copy to client and server for maximum compatibility
        cp .env client/.env
        mkdir -p server && cp .env server/.env

    - name: Type check
      run: npm run check

    - name: Lint
      run: npx eslint .   # erros falham; warnings de exhaustive-deps são visíveis

    - name: Run unit tests
      run: npm run test

    - name: Build
      run: npm run build

    - name: Smoke test production server
      run: |
        DATA_DIR="$(mktemp -d)" PORT=3101 NODE_ENV=production node dist/index.cjs > /tmp/soe-smoke.log 2>&1 &
        SERVER_PID=$!
        trap "kill $SERVER_PID 2>/dev/null || true" EXIT
        for i in $(seq 1 20); do
          if curl -fsS http://127.0.0.1:3101/ > /dev/null && \
             curl -fsS http://127.0.0.1:3101/api/health | grep -q '"status":"ok"'; then
            echo "Smoke test OK"
            exit 0
          fi
          sleep 1
        done
        cat /tmp/soe-smoke.log
        exit 1

  # Job independente: não tem "needs" e não bloqueia build-and-test.
  # Sobe o servidor de produção e roda os testes Playwright contra ele.
  e2e:
    # ubuntu-latest virou 26.04 e o Playwright 1.59 ainda não publica build para
    # essa distro ("does not support chromium on ubuntu26.04-x64"). Fixamos a
    # imagem suportada até subir o Playwright para uma versão com suporte.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      # O `install --with-deps` (que roda apt) foi o passo que falhou na
      # primeira execução. Agora: baixa o Chromium com retry e tenta as libs
      # do sistema em separado, sem derrubar o job se o apt falhar.
      run: |
        npx playwright --version
        installed=0
        for attempt in 1 2 3; do
          if npx playwright install chromium; then installed=1; break; fi
          echo "::warning::tentativa $attempt de baixar o Chromium falhou; aguardando 5s"
          sleep 5
        done
        if [ "$installed" -ne 1 ]; then
          echo "::error::Não foi possível baixar o Chromium após 3 tentativas"
          exit 1
        fi
        if ! npx playwright install-deps chromium; then
          echo "::warning::install-deps falhou; seguindo com as libs já presentes na imagem do runner"
        fi

    - name: Build
      run: npm run build

    - name: Start production server
      run: |
        DATA_DIR="$(mktemp -d)"
        export DATA_DIR
        PORT=3101 NODE_ENV=production node dist/index.cjs > /tmp/soe-e2e.log 2>&1 &
        echo $! > /tmp/soe-e2e.pid
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:3101/api/health | grep -q '"status":"ok"'; then
            echo "Servidor pronto em http://127.0.0.1:3101 (DATA_DIR=$DATA_DIR)"
            exit 0
          fi
          sleep 1
        done
        echo "Servidor não respondeu em /api/health. Log:"
        cat /tmp/soe-e2e.log
        exit 1

    - name: Run Playwright tests
      env:
        PLAYWRIGHT_BASE_URL: http://127.0.0.1:3101
      run: npx playwright test

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
        if-no-files-found: ignore

    - name: Stop production server
      if: always()
      run: |
        if [ -f /tmp/soe-e2e.pid ]; then
          kill "$(cat /tmp/soe-e2e.pid)" 2>/dev/null || true
        fi

