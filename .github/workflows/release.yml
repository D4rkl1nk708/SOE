name: Auto Release Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.get_version.outputs.VERSION }}" | grep -q "refs/tags/v${{ steps.get_version.outputs.VERSION }}"; then
            echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Create Git Tag
        if: env.TAG_EXISTS == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.get_version.outputs.VERSION }}"
          git push origin "v${{ steps.get_version.outputs.VERSION }}"

      - name: Setup Build Environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > .env
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

          mkdir -p client
          cp .env client/.env
          mkdir -p server
          cp .env server/.env

      - name: Build Web App
        run: npm run build

      - name: Build Android APK
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -d android ]; then
            npx cap sync android
            chmod +x android/gradlew
            ./android/gradlew -p android assembleRelease
            cp android/app/build/outputs/apk/release/*.apk "Android-SOE-v${{ env.VERSION }}.apk"
          else
            echo "Android project not present; skipping."
          fi

      - name: Build Linux AppImage
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run desktop:build:linux || true
          if [ -f release/*.AppImage ]; then
            cp release/*.AppImage "Linux-SOE-v${{ env.VERSION }}.AppImage"
          fi

      - name: Build Windows Executable
        continue-on-error: true
        run: |
          npm run desktop:build:win || true
          if [ -f release/*.exe ]; then
            cp release/*.exe "Windows-SOE-v${{ env.VERSION }}.exe"
          fi

      - name: Publish GitHub Release
        if: env.TAG_EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SOE v${{ env.VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            Android-SOE-v*.apk
            Linux-SOE-v*.AppImage
            Windows-SOE-v*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
