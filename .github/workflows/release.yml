name: Auto Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag_exists: ${{ steps.check_tag.outputs.TAG_EXISTS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.get_version.outputs.VERSION }}" | grep -q "refs/tags/v${{ steps.get_version.outputs.VERSION }}"; then
            echo "TAG_EXISTS=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.get_version.outputs.VERSION }} already exists."
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.get_version.outputs.VERSION }} does not exist. Proceeding with release."
          fi

  build-android:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (For Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts
          else
            npm install --legacy-peer-deps --ignore-scripts
          fi

      - name: Setup Build Environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > .env
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF
          mkdir -p client server
          cp .env client/.env
          cp .env server/.env
          cat <<EOF > client/src/lib/env.ts
          export const ENV_SUPABASE_URL = "${VITE_SUPABASE_URL}";
          export const ENV_SUPABASE_ANON_KEY = "${VITE_SUPABASE_ANON_KEY}";
          EOF

      - name: Build Web Assets
        run: npm run build:clean

      - name: Update Preload and Android Assets
        run: node build.cjs

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease
          cd ..
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::Android APK not found in android/app/build/outputs/apk!"
            exit 1
          fi
          echo "Found Android APK: $APK_FILE"
          cp "$APK_FILE" "Android-SOE-v${{ needs.prepare.outputs.version }}.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-android
          path: Android-SOE-v*.apk
          if-no-files-found: error

  build-linux:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts
          else
            npm install --legacy-peer-deps --ignore-scripts
          fi

      - name: Setup Build Environment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > .env
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF
          mkdir -p client server
          cp .env client/.env
          cp .env server/.env
          cat <<EOF > client/src/lib/env.ts
          export const ENV_SUPABASE_URL = "${VITE_SUPABASE_URL}";
          export const ENV_SUPABASE_ANON_KEY = "${VITE_SUPABASE_ANON_KEY}";
          EOF

      - name: Build Linux AppImage
        run: |
          npm run desktop:build:linux
          APPIMAGE_FILE=$(find release -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE_FILE" ]; then
            echo "::error::Linux AppImage not found in release/!"
            exit 1
          fi
          echo "Found Linux AppImage: $APPIMAGE_FILE"
          cp "$APPIMAGE_FILE" "Linux-SOE-v${{ needs.prepare.outputs.version }}.AppImage"

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux
          path: Linux-SOE-v*.AppImage
          if-no-files-found: error

  build-windows:
    needs: prepare
    if: needs.prepare.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts
          else
            npm install --legacy-peer-deps --ignore-scripts
          fi

      - name: Setup Build Environment
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > .env
          VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
          VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF
          mkdir -p client server
          cp .env client/.env
          cp .env server/.env
          cat <<EOF > client/src/lib/env.ts
          export const ENV_SUPABASE_URL = "${VITE_SUPABASE_URL}";
          export const ENV_SUPABASE_ANON_KEY = "${VITE_SUPABASE_ANON_KEY}";
          EOF

      - name: Build Windows Executable
        shell: bash
        run: npm run desktop:build:win

      - name: Prepare Windows Executable
        shell: bash
        run: |
          EXE_FILE=$(find release -name "*.exe" | head -n 1)
          if [ -z "$EXE_FILE" ]; then
            echo "::error::Windows .exe not found in release/!"
            exit 1
          fi
          echo "Found Windows executable: $EXE_FILE"
          cp "$EXE_FILE" "Windows-SOE-v${{ needs.prepare.outputs.version }}.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: Windows-SOE-v*.exe
          if-no-files-found: error

  publish-release:
    needs: [prepare, build-android, build-linux, build-windows]
    if: always() && (needs.prepare.outputs.tag_exists == 'false' || github.event_name == 'workflow_dispatch') && (needs.build-android.result == 'success' || needs.build-linux.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-artifacts-*
          merge-multiple: true

      - name: List Release Assets
        run: |
          ls -la release-assets
          if [ -z "$(ls -A release-assets 2>/dev/null)" ]; then
            echo "::error::No release artifacts found to publish!"
            exit 1
          fi

      - name: Create Git Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git ls-remote --tags origin "refs/tags/v${{ needs.prepare.outputs.version }}" | grep -q "refs/tags/v${{ needs.prepare.outputs.version }}"; then
            git tag "v${{ needs.prepare.outputs.version }}"
            git push origin "v${{ needs.prepare.outputs.version }}"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: SOE v${{ needs.prepare.outputs.version }}
          make_latest: true
          generate_release_notes: true
          files: release-assets/*
          token: ${{ secrets.GITHUB_TOKEN }}
