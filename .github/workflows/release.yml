name: Auto Release Build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: Production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (For Android Build)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create environment files
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> $GITHUB_ENV
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> $GITHUB_ENV
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> $GITHUB_ENV
          # Also keep the .env file as a fallback
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env
          # Copy to client and server for maximum compatibility
          cp .env client/.env
          mkdir -p server && cp .env server/.env

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git ls-remote --tags origin refs/tags/v${{ steps.get_version.outputs.VERSION }} | grep -q "refs/tags/v${{ steps.get_version.outputs.VERSION }}"; then
            echo "TAG_EXISTS=true" >> $GITHUB_ENV
          else
            echo "TAG_EXISTS=false" >> $GITHUB_ENV
          fi

      - name: Create Git Tag
        if: env.TAG_EXISTS == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ steps.get_version.outputs.VERSION }}
          git push origin v${{ steps.get_version.outputs.VERSION }}

      - name: Install Wine for Windows Build
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32

      - name: Build Android APK
        run: |
          npm run build:clean
          npx cap sync android
          chmod +x android/gradlew
          ./android/gradlew -p android assembleRelease
          cp android/app/build/outputs/apk/release/*.apk Android-SOE-v${{ steps.get_version.outputs.VERSION }}.apk

      - name: Build Linux AppImage
        run: |
          npm run desktop:build:linux
          cp release/*.AppImage Linux-SOE-v${{ steps.get_version.outputs.VERSION }}.AppImage

      - name: Build Windows Executable
        run: |
          npm run desktop:build:win
          cp release/*.exe Windows-SOE-v${{ steps.get_version.outputs.VERSION }}.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: SOE v${{ steps.get_version.outputs.VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            Android-SOE-v*.apk
            Linux-SOE-v*.AppImage
            Windows-SOE-v*.exe
          token: ${{ secrets.GITHUB_TOKEN }}
