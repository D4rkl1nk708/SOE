apply plugin: 'com.android.application'

// Lê a versão diretamente do texto do package.json (sem depender de JsonSlurper)
def getSoeVersion() {
    def inputFile = file('../../package.json')
    def text = inputFile.text
    def matcher = (text =~ /"version":\s*"([^"]+)"/)
    return matcher ? matcher[0][1] : "1.0.0"
}

def versionNameStr = getSoeVersion()
def versionParts = versionNameStr.split('\\.')
def versionCodeNum = versionParts[0].toInteger() * 10000 + versionParts[1].toInteger() * 100 + versionParts[2].toInteger()

// Assinatura de release: credenciais ficam em android/keystore.properties,
// que NÃO é versionado (ver .gitignore e keystore.properties.example).
// O arquivo é opcional: sem ele o build continua (fallback para a debug key),
// mas o APK resultante NÃO serve para publicar em produção.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { stream ->
        keystoreProperties.load(stream)
    }
}

def requiredKeystoreKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseKeystore = keystorePropertiesFile.exists() &&
        requiredKeystoreKeys.every { key -> keystoreProperties[key]?.trim() }

def warnMissingReleaseKeystore = {
    println ""
    println "######################################################################"
    println "#  AVISO: assinatura de release NAO configurada.                    #"
    println "#  android/keystore.properties ausente ou incompleto.               #"
    println "#  O build de release usara a chave de DEBUG e o APK/AAB gerado     #"
    println "#  NAO esta assinado para producao. Nao publique na Play Store.     #"
    println "#  Crie android/keystore.properties (veja o .example no repo).      #"
    println "######################################################################"
    println ""
}

android {
    namespace = "com.soe.estudos"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.soe.estudos"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionCodeNum
        versionName versionNameStr
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Só declara a signingConfig de release se as credenciais existirem.
        if (hasReleaseKeystore) {
            release {
                // storeFile é relativo a android/app (ou um caminho absoluto).
                storeFile file(keystoreProperties['storeFile'].trim())
                storePassword keystoreProperties['storePassword'].trim()
                keyAlias keystoreProperties['keyAlias'].trim()
                keyPassword keystoreProperties['keyPassword'].trim()
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            } else {
                warnMissingReleaseKeystore()
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
